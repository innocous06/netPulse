# NetPulse Nginx Reverse Proxy Configuration
# Target VPS Port: 8443 -> Backend Node.js Port: 3000

# Rate limit zone for authentication endpoint (5 requests/min per IP)
limit_req_zone $binary_remote_addr zone=netpulse_auth_limit:10m rate=5r/m;

server {
    listen 8443;
    listen [::]:8443;
    server_name _;

    # Logging
    access_log /var/log/nginx/netpulse.access.log;
    error_log /var/log/nginx/netpulse.error.log;

    # Client body size limit (allows up to 110M payload for upload speed tests)
    client_max_body_size 110M;

    # Gzip Compression Settings
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/x-javascript
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Rate-limited Auth Endpoint
    location /api/auth {
        limit_req zone=netpulse_auth_limit burst=3 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dedicated WebSocket Route for Diagnostics & Live Streams
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # High timeouts for persistent WebSocket diagnostic sessions
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        # Disable buffering for instant message delivery
        proxy_buffering off;
    }

    # Main Application Proxy (REST API, Static UI & Speed Tests)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # High timeouts for long-running speed test streams (upload/download)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        # Disable buffering for accurate real-time speed test measurements
        proxy_buffering off;
    }
}
